<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palo y Relato | Historias y Curiosidades</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #13295c 0%, #070d1f 65%, #03060f 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 50px;
    }

    /* Banner superior */
    .banner {
      width: 100%;
      max-width: 680px;
      height: 180px;
      background-image: url('banner.png');
      background-size: cover;
      background-position: center;
      border-bottom: 3px solid #ffcc00;
      box-shadow: 0 4px 20px rgba(255, 204, 0, 0.25);
    }

    /* Contenedor principal */
    .container {
      width: 100%;
      max-width: 480px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -65px; /* Superpone el logo sobre el banner */
    }

    /* Logo circular con borde brillante */
    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ffcc00;
      box-shadow: 0 0 25px rgba(255, 190, 0, 0.6);
      background-color: #070d1f;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    h1 span { color: #ffcc00; }

    .tagline {
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffd966;
      background: rgba(122, 24, 46, 0.85); /* Color sudadera */
      border: 1px solid #ffaa00;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 30px;
      text-align: center;
    }

    /* Botones de enlaces */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 20px;
      background: linear-gradient(135deg, #102048 0%, #0b1633 100%);
      color: #ffffff;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 14px;
      border: 2px solid #ffbb00;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    .link-btn:hover {
      transform: translateY(-3px) scale(1.01);
      background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
      color: #070d1f;
      box-shadow: 0 6px 22px rgba(255, 204, 0, 0.5);
    }

    /* Botón destacado (ej. Último vídeo) */
    .link-btn.featured {
      background: linear-gradient(135deg, #8c1d36 0%, #5c1022 100%);
      border-color: #ffcc00;
    }

    .link-btn.featured:hover {
      background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
      color: #070d1f;
    }

    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: #7a8bb5;
    }
  </style>
</head>
<body>

  <div class="banner"></div>

  <div class="container">
    <img src="logo.png" alt="Palo y Relato" class="avatar">
    
    <h1>Palo y <span>Relato</span></h1>
    <div class="tagline">Historias • Datos Curiosos • Grandes Preguntas</div>

    <div class="links">
      <a class="link-btn featured" href="https://www.youtube.com/@PaloyRelato" target="_blank">🎬 Último Vídeo en YouTube</a>
      <a class="link-btn" href="https://www.tiktok.com/@paloyrelato" target="_blank">🎵 TikTok</a>
      <a class="link-btn featured" href="https://paloyrelato.itch.io/" target="_blank">🎮 Mis juegos</a>
    </div>

    <footer>© 2026 Palo y Relato</footer>
  </div>

</body>
</html>
