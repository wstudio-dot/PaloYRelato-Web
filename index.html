<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palo y Relato | Historias y Curiosidades</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #13295c 0%, #070d1f 65%, #03060f 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 50px;
    }

    /* Banner superior */
    .banner {
      width: 100%;
      max-width: 680px;
      height: 180px;
      background-image: url('banner.png');
      background-size: cover;
      background-position: center;
      border-bottom: 3px solid #ffcc00;
      box-shadow: 0 4px 20px rgba(255, 204, 0, 0.25);
    }

    /* Contenedor principal un poco más ancho */
    .container {
      width: 100%;
      max-width: 560px; /* Antes estaba en 480px */
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -65px;
    }

    /* Logo circular con borde brillante */
    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ffcc00;
      box-shadow: 0 0 25px rgba(255, 190, 0, 0.6);
      background-color: #070d1f;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    h1 span { color: #ffcc00; }

    .tagline {
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffd966;
      background: rgba(122, 24, 46, 0.85); /* Color sudadera */
      border: 1px solid #ffaa00;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 30px;
      text-align: center;
    }

    /* Botones de enlaces */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 20px;
      background: linear-gradient(135deg, #102048 0%, #0b1633 100%);
      color: #ffffff;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 14px;
      border: 2px solid #ffbb00;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .link-btn:hover {
      transform: translateY(-3px) scale(1.01);
      background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
      color: #070d1f;
      box-shadow: 0 6px 22px rgba(255, 204, 0, 0.5);
    }

    /* Botón destacado */
    .link-btn.featured {
      background: linear-gradient(135deg, #8c1d36 0%, #5c1022 100%);
      border-color: #ffcc00;
    }

    .link-btn.featured:hover {
      background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
      color: #070d1f;
    }

    /* Desplegable del juego */
    .game-drawer {
      display: none;
      flex-direction: column;
      width: 100%;
      background: #070d1f;
      border: 2px solid #ffcc00;
      border-radius: 14px;
      overflow: hidden;
      margin-top: -5px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }

    .game-drawer.open {
      display: flex;
    }

    .game-frame {
      width: 100%;
      height: 620px; /* Más alto para que quepa todo el escenario */
      max-height: 80vh; /* Evita que desborde en pantallas pequeñas */
      border: none;
      background: #000;
    }


    .game-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: #102048;
      font-size: 0.85rem;
      border-top: 1px solid rgba(255, 204, 0, 0.3);
    }

    .game-bar a {
      color: #ffcc00;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: #7a8bb5;
    }
  </style>
</head>
<body>

  <div class="banner"></div>

  <div class="container">
    <img src="logo.png" alt="Palo y Relato" class="avatar">
    
    <h1>Palo y <span>Relato</span></h1>
    <div class="tagline">Historias • Datos Curiosos • Grandes Preguntas</div>

    <div class="links">
      <a class="link-btn" href="https://www.youtube.com/@PaloyRelato" target="_blank">🎬 YouTube</a>
      <a class="link-btn" href="https://www.tiktok.com/@paloyrelato" target="_blank">🎵 TikTok</a>
      
      <!-- Desplegable para jugar aquí mismo -->
      <button class="link-btn featured" id="toggleGameBtn" onclick="toggleGame()">
        🕹️ Jugar aquí mismo ▼
      </button>

      <div class="game-drawer" id="gameDrawer">
        <iframe id="gameIframe" class="game-frame" data-src="juego/" title="Minijuego Palo y Relato"></iframe>
        <div class="game-bar">
          <span>Minijuego de Palo y Relato</span>
          <a href="juego/" target="_blank">Pantalla completa ↗</a>
        </div>
      </div>

      <a class="link-btn" href="https://paloyrelato.itch.io/" target="_blank">🎮 Más juegos en itch.io</a>
    </div>

    <footer>© 2026 Palo y Relato</footer>
  </div>

  <script>
    function toggleGame() {
      const drawer = document.getElementById('gameDrawer');
      const btn = document.getElementById('toggleGameBtn');
      const iframe = document.getElementById('gameIframe');

      drawer.classList.toggle('open');

      if (drawer.classList.contains('open')) {
        if (!iframe.src) {
          iframe.src = iframe.getAttribute('data-src');
        }
        btn.innerHTML = '❌ Cerrar juego ▲';
      } else {
        btn.innerHTML = '🕹️ Jugar aquí mismo ▼';
      }
    }
  </script>

</body>
</html>
