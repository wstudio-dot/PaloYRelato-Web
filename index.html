<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Enlaces</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      margin: 0;
    }
    h1 { font-size: 1.5rem; margin-bottom: 5px; }
    p { color: #aaaaaa; margin-bottom: 30px; }
    .link {
      display: block;
      width: 100%;
      max-width: 400px;
      padding: 15px;
      margin-bottom: 15px;
      background-color: #242424;
      color: #ffffff;
      text-decoration: none;
      text-align: center;
      border-radius: 10px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .link:hover { background-color: #383838; }
  </style>
</head>
<body>

  <h1>@TuNombre</h1>
  <p>Bienvenido a mis enlaces oficiales</p>

  <a class="link" href="https://instagram.com" target="_blank">Instagram</a>
  <a class="link" href="https://tiktok.com" target="_blank">TikTok</a>
  <a class="link" href="https://youtube.com" target="_blank">YouTube</a>

</body>
</html>
